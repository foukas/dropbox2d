dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    // TrueType font rendering for the HUD redesign (plan-eng-review Next Step 11).
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    // Post-processing FBO pipeline for bloom/CRT (plan-eng-review Next Step 10).
    api 'com.crashinvaders.vfx:gdx-vfx-core:0.5.4'
    api 'com.crashinvaders.vfx:gdx-vfx-effects:0.5.4'

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    testRuntimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
}

test {
    // The trapdoor drop sweep (~hundreds of thousands of headless Box2D
    // runs) is tagged "sweep" and kept out of the normal suite; run it with
    // sweepTest (docs/designs/seesaw-trapdoor.md, eng review T0/R3-8).
    useJUnitPlatform {
        excludeTags 'sweep'
    }
}

tasks.register('sweepTest', Test) {
    description = 'Runs the trapdoor seesaw drop sweep; writes build/reports/seesaw-sweep.csv.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'sweep'
    }
    maxHeapSize = '1g'
    testLogging.showStandardStreams = true
    outputs.upToDateWhen { false }
}
